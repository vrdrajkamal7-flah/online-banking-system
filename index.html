<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Developers — Online Banking System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B131D;
  --surface:#131F2C;
  --surface-2:#1B2A3A;
  --line:#2A3B4D;
  --paper:#ECE7DA;
  --muted:#8095AC;
  --gold:#C79A4B;
  --gold-dim:#8F7038;
  --mint:#4FAE84;
  --rose:#C1554A;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--ink);
  color:var(--paper);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.serif{
  font-family:'Fraunces',serif;
  font-weight:500;
  letter-spacing:0.01em;
  margin:0;
}
.mono{ font-family:'IBM Plex Mono',monospace; }
a{color:inherit;}
button{font-family:inherit;}
::selection{ background:var(--gold-dim); color:var(--paper); }

/* Gmail OTP countdown */
.otp-countdown{margin:12px 0 14px;padding:12px 14px;border:1px solid var(--line);background:var(--surface-2);font-family:'IBM Plex Mono',monospace;font-size:15px;text-align:center;}
.otp-countdown strong{font-size:20px;color:var(--gold);}
.otp-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;}

/* focus visibility */
button:focus-visible, input:focus-visible, select:focus-visible{
  outline:2px solid var(--gold);
  outline-offset:2px;
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}

/* ---------- layout shells ---------- */
#app{ min-height:100vh; display:flex; flex-direction:column; }

/* ===== AUTH SCREEN ===== */
.auth-wrap{
  flex:1; display:grid; grid-template-columns: 1.1fr 1fr;
  min-height:100vh;
}
@media (max-width: 880px){ .auth-wrap{ grid-template-columns: 1fr; } .auth-left{ display:none; } }

.auth-left{
  background:
    radial-gradient(circle at 15% 20%, rgba(199,154,75,0.10), transparent 40%),
    var(--ink);
  padding:64px 56px;
  border-right:1px solid var(--line);
  display:flex; flex-direction:column; justify-content:space-between;
}
.brand{
  display:flex; align-items:center; gap:12px;
}
.brand-mark{
  width:34px; height:34px; border:1.5px solid var(--gold);
  display:flex; align-items:center; justify-content:center;
  font-family:'Fraunces',serif; font-size:18px; color:var(--gold);
  transform:rotate(0deg);
}
.brand-mark-img{
  width:42px; height:42px; object-fit:contain; border-radius:50%;
  border:1px solid var(--line); display:block; flex-shrink:0;
  background:#15181c;
}
.brand-name{ font-family:'Fraunces',serif; font-size:19px; letter-spacing:0.02em; }
.brand-name span{ color:var(--muted); font-family:'Inter',sans-serif; font-size:12px; display:block; margin-top:2px; letter-spacing:0.08em;}

.hero-line{
  font-size:44px; line-height:1.15; max-width:9.5em; margin-top:56px;
}
.hero-sub{
  color:var(--muted); font-size:15px; line-height:1.6; max-width:32em; margin-top:18px;
}

.ledger-features{ margin-top:52px; border-top:1px solid var(--line); }
.ledger-features .row{
  display:flex; justify-content:space-between; align-items:baseline;
  padding:16px 0; border-bottom:1px solid var(--line);
  font-size:13.5px;
}
.ledger-features .row .k{ color:var(--paper); }
.ledger-features .row .v{ color:var(--muted); font-family:'IBM Plex Mono',monospace; font-size:12.5px; }

.foot-note{ color:var(--muted); font-size:12px; margin-top:40px; }

.auth-right{
  display:flex; align-items:center; justify-content:center; padding:40px 28px;
}
.auth-card{ width:100%; max-width:400px; }
.auth-card h2{ font-size:26px; margin-bottom:6px; }
.auth-card .sub{ color:var(--muted); font-size:14px; margin-bottom:30px; }

.tabbar{ display:flex; gap:0; border-bottom:1px solid var(--line); margin-bottom:28px; }
.tabbar button{
  background:none; border:none; color:var(--muted);
  font-size:14px; padding:10px 0; margin-right:28px; cursor:pointer;
  border-bottom:2px solid transparent; transition:color .15s ease, border-color .15s ease;
}
.tabbar button.active{ color:var(--paper); border-bottom-color:var(--gold); }

.field{ margin-bottom:18px; }
.field label{ display:block; font-size:12.5px; color:var(--muted); margin-bottom:7px; }
.field input, .field select{
  width:100%; background:var(--surface-2); border:1px solid var(--line);
  color:var(--paper); padding:11px 12px; border-radius:3px; font-size:14.5px;
  font-family:'IBM Plex Mono',monospace;
}
.field input::placeholder{ color:#54677E; font-family:'Inter',sans-serif; }
.field .hint{ font-size:11.5px; color:var(--muted); margin-top:6px; line-height:1.5; }
.field .err{ font-size:12px; color:var(--rose); margin-top:6px; }

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  background:var(--gold); color:#1B140A; border:none; font-weight:600;
  font-size:14px; padding:12px 20px; border-radius:3px; cursor:pointer;
  width:100%; transition:filter .15s ease, transform .1s ease;
  font-family:'Inter',sans-serif;
}
.btn:hover{ filter:brightness(1.08); }
.btn:active{ transform:translateY(1px); }
.btn.secondary{
  background:transparent; color:var(--paper); border:1px solid var(--line);
  font-weight:500;
}
.btn.secondary:hover{ border-color:var(--gold); }
.btn.danger{ background:var(--rose); color:#2A0F0C; }
.btn.ghost{ background:transparent; color:var(--muted); border:none; width:auto; padding:8px 0; font-weight:500; text-decoration:underline; text-underline-offset:3px; }

.msg-banner{
  border:1px solid var(--line); border-left:3px solid var(--gold);
  background:var(--surface-2); padding:12px 14px; font-size:13.5px;
  border-radius:2px; margin-bottom:20px; line-height:1.5;
}
.msg-banner.err{ border-left-color:var(--rose); }
.msg-banner.ok{ border-left-color:var(--mint); }

/* ===== APP SHELL (post login) ===== */
.shell-header{
  border-bottom:1px solid var(--line); background:var(--ink);
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 28px; position:sticky; top:0; z-index:5;
}
.session-pill{
  display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--muted);
}
.session-pill .dot{ width:7px; height:7px; border-radius:50%; background:var(--mint); }
.session-pill .role{ color:var(--paper); font-weight:600; }
.shell-body{ flex:1; display:grid; grid-template-columns: 250px 1fr; }
@media (max-width: 820px){ .shell-body{ grid-template-columns: 1fr; } .rail{ display:none; } }

.rail{
  border-right:1px solid var(--line); padding:24px 0;
}
.rail .group-label{
  font-size:11px; letter-spacing:0.04em; color:#54677E; padding:0 24px; margin-bottom:8px;
}
.rail button{
  display:block; width:100%; text-align:left; background:none; border:none;
  color:var(--muted); padding:11px 24px; font-size:14px; cursor:pointer;
  border-left:2px solid transparent; transition:color .15s ease, border-color .15s ease, background .15s ease;
}
.rail button:hover{ color:var(--paper); background:var(--surface); }
.rail button.active{ color:var(--gold); border-left-color:var(--gold); background:var(--surface); }
.rail .divider{ height:1px; background:var(--line); margin:16px 24px; }

.main{ padding:32px 36px 0; }
.panel-title{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:10px;}
.panel-title h2{ font-size:23px; }
.panel-title .desc{ color:var(--muted); font-size:13px; }

.card{
  background:var(--surface); border:1px solid var(--line); border-radius:4px;
  padding:24px; margin-bottom:20px;
}
.stat-row{ display:flex; gap:0; flex-wrap:wrap; border:1px solid var(--line); border-radius:4px; overflow:hidden; margin-bottom:22px;}
.stat{ flex:1; min-width:150px; padding:18px 22px; border-right:1px solid var(--line); }
.stat:last-child{ border-right:none; }
.stat .label{ font-size:11.5px; color:var(--muted); margin-bottom:8px; letter-spacing:0.02em;}
.stat .value{ font-family:'IBM Plex Mono',monospace; font-size:19px; }
.status-tag{
  display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:3px 9px;
  border-radius:20px; border:1px solid var(--line);
}
.status-tag.active{ color:var(--mint); border-color:rgba(79,174,132,0.4); }
.status-tag.blocked{ color:var(--rose); border-color:rgba(193,85,74,0.4); }

.actions-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(180px,1fr)); gap:12px; }
.action-tile{
  background:var(--surface); border:1px solid var(--line); border-radius:4px;
  padding:18px; text-align:left; cursor:pointer; color:var(--paper);
  transition:border-color .15s ease, transform .1s ease;
}
.action-tile:hover{ border-color:var(--gold); }
.action-tile:active{ transform:translateY(1px); }
.action-tile .t{ font-family:'Fraunces',serif; font-size:15.5px; margin-bottom:6px; }
.action-tile .d{ font-size:12px; color:var(--muted); line-height:1.5; }

table{ width:100%; border-collapse:collapse; font-size:13.5px; }
th{ text-align:left; color:var(--muted); font-weight:500; font-size:11.5px; padding:0 10px 10px; border-bottom:1px solid var(--line); }
td{ padding:12px 10px; border-bottom:1px solid var(--line); font-family:'IBM Plex Mono',monospace; font-size:13px; }
tr:last-child td{ border-bottom:none; }

.empty-state{
  text-align:center; padding:48px 20px; color:var(--muted); font-size:13.5px;
}

/* ledger receipt strip */
.ledger-strip{
  border-top:1px solid var(--line); margin-top:8px; padding:22px 36px 40px;
}
.ledger-strip h3{ font-size:13px; color:var(--muted); letter-spacing:0.02em; margin-bottom:14px; font-family:'Inter',sans-serif; font-weight:600;}
.entry{
  display:grid; grid-template-columns: 90px 1fr auto; gap:14px; align-items:baseline;
  padding:10px 0; border-bottom:1px dashed var(--line); font-size:12.5px;
  animation: slidein .25s ease;
}
@keyframes slidein{ from{ opacity:0; transform:translateY(-4px);} to{opacity:1; transform:none;} }
.entry .time{ color:#54677E; font-family:'IBM Plex Mono',monospace; }
.entry .text{ color:var(--muted); }
.entry .text b{ color:var(--paper); font-weight:500; }
.entry .amt{ font-family:'IBM Plex Mono',monospace; }
.entry .amt.credit{ color:var(--mint); }
.entry .amt.debit{ color:var(--rose); }

.two-col{ display:grid; grid-template-columns: 1fr 1fr; gap:20px; }
@media (max-width:700px){ .two-col{ grid-template-columns:1fr; } }

.select-list{ display:flex; flex-direction:column; gap:10px; }
.select-row{
  display:flex; justify-content:space-between; align-items:center;
  border:1px solid var(--line); border-radius:4px; padding:14px 16px; cursor:pointer;
  transition:border-color .15s ease;
}
.select-row:hover{ border-color:var(--gold); }
.select-row .l .name{ font-family:'Fraunces',serif; font-size:14.5px; }
.select-row .l .sub{ color:var(--muted); font-size:12px; font-family:'IBM Plex Mono',monospace; margin-top:3px;}
.select-row .r{ font-family:'IBM Plex Mono',monospace; font-size:14px; }

.back-link{
  color:var(--muted); font-size:13px; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  margin-bottom:16px; background:none; border:none; padding:0; font-family:'Inter',sans-serif;
}
.back-link:hover{ color:var(--gold); }

.radio-opts{ display:flex; gap:10px; margin-bottom:18px; }
.radio-opts label{
  flex:1; border:1px solid var(--line); border-radius:4px; padding:12px 14px;
  font-size:13.5px; cursor:pointer; display:flex; align-items:center; gap:9px;
  color:var(--muted); transition:border-color .15s ease, color .15s ease;
}
.radio-opts input{ accent-color:var(--gold); }
.radio-opts label.checked{ border-color:var(--gold); color:var(--paper); }

.footer-tag{ text-align:center; color:#3E4E60; font-size:11.5px; padding:18px 0 30px; }
</style>

/* -------- small helpers -------- */
function el(tag, attrs={}, children){
  const node = document.createElement(tag);
  for(const k in attrs){
    if(k==='class') node.className = attrs[k];
    else if(k==='style') node.setAttribute('style', attrs[k]);
    else node.setAttribute(k, attrs[k]);
  }
  if(children!==undefined){
    (Array.isArray(children)?children:[children]).forEach(c=>{
      node.append(c instanceof Node ? c : document.createTextNode(c));
    });
  }
  return node;
}

function fmtMoney(n){return 'Rs.'+Number(n).toLocaleString('en-IN');}
function nowStamp(){const d=new Date();return {date:d.toLocaleDateString('en-GB').replace(/\//g,'-'),time:d.toLocaleTimeString('en-US')};}
function pushLog(text,amt=null,kind=null){const {date,time}=nowStamp();state.log.unshift({date,time,text,amt,kind});if(state.log.length>40)state.log.pop();}
function validMobile(m){return /^[0-9]{10}$/.test(m);}
function validEmail(m){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m);}
function validPin(p){return /^[0-9]{4}$/.test(p);}
function validUsername(u){return /^[A-Z0-9]+$/.test(u);}
function validPassword(p){return p.length>=8;}
function findAccount(acn){return state.accounts.findIndex(a=>String(a.acn)===String(acn));}
function findUser(email){return state.users.findIndex(u=>String(u.email||'').toLowerCase()===String(email||'').toLowerCase());}
function accountsForMobile(mobile){return state.accounts.map((a,i)=>({...a,idx:i})).filter(a=>a.mobile===mobile);}
function bankIndex(name){return BANKS.findIndex(b=>b.name===name);}
function employeeForBank(b){return BANKS[b].employee;}
function employeePassword(b){return BANKS[b].name.toUpperCase()+' OBS';}
function currentAcc(){return state.accounts[state.session.currentAccount];}

function renderRegistration(card){
  card.append(el('h2',{},'New registration'));
  card.append(el('p',{class:'sub'},'Verify your Gmail email address with a unique OTP before creating your password.'));
  const wrap=el('div',{class:'field'});
  wrap.append(el('label',{},'Email ID'));
  const email=el('input',{type:'email',placeholder:'you@example.com',autocomplete:'email'});
  wrap.append(email); card.append(wrap);
  if(state.pendingRegistration) email.value=state.pendingRegistration.email;

  if(!state.pendingRegistration){
    const send=el('button',{class:'btn'},'Send OTP to Gmail');
    send.onclick=()=>startRegistration(email.value.trim().toLowerCase());
    card.append(send);
    return;
  }

  if(!state.pendingRegistration.verified){
    const p=state.pendingRegistration;
    card.append(el('div',{class:'msg-banner ok'},'OTP sent to '+p.email+'. Check your Gmail inbox or Spam folder.'));
    const countdown=el('div',{class:'otp-countdown'});
    card.append(countdown);

    const otp=fieldInput('Gmail OTP','text','Enter 6-digit OTP');
    otp.input.maxLength=6; otp.input.inputMode='numeric'; otp.input.autocomplete='one-time-code';
    otp.input.addEventListener('input',()=>otp.input.value=otp.input.value.replace(/\D/g,''));
    card.append(otp.wrap);

    const verify=el('button',{class:'btn'},'Verify OTP');
    verify.onclick=()=>verifyRegistrationOTP(otp.input.value.trim());
    card.append(verify);

    const resend=el('button',{class:'btn ghost'},'Resend OTP');
    resend.onclick=()=>requestEmailOTP(p.email,true);
    card.append(resend);

    card.append(el('div',{class:'hint'},'Resend attempts: '+(p.resendCount||0)+'/5. Each resend creates a new OTP.'));
    const cancel=el('button',{class:'btn ghost'},'Use another email');
    cancel.onclick=()=>{if(p.countdownTimer)clearInterval(p.countdownTimer);state.pendingRegistration=null;view.msg=null;render();};
    card.append(cancel);

    startOtpCountdown(countdown,p);
    return;
  }

  card.append(el('div',{class:'msg-banner ok'},'Email verified. Now set your password.'));
  const pass=fieldInput('Create password','password','Minimum 8 characters');
  const confirm=fieldInput('Confirm password','password','Re-enter password');
  card.append(pass.wrap,confirm.wrap);
  card.append(el('div',{class:'hint'},'Password must contain at least 8 characters.'));
  const finish=el('button',{class:'btn'},'Create Login');
  finish.onclick=()=>finishRegistration(email.value.trim().toLowerCase(),pass.input.value,confirm.input.value);
  card.append(finish);
}

function startOtpCountdown(box,p){
  if(p.countdownTimer)clearInterval(p.countdownTimer);
  const tick=()=>{
    const remaining=Math.max(0,Math.ceil((p.expiresAt-Date.now())/1000));
    box.innerHTML='OTP expires in <strong>'+remaining+' seconds</strong>';
    if(remaining<=0){
      clearInterval(p.countdownTimer);
      box.innerHTML='OTP expired — <strong>0 seconds</strong>';
    }
  };
  tick();
  p.countdownTimer=setInterval(tick,250);
}

// Left empty ("") on purpose: when this file is served BY the Flask backend
// itself (index.html sitting next to backend_app.py, see the bottom of
// backend_app.py), the frontend and API share the same origin, so a plain
// relative path like "/send-otp" already reaches the right server — no URL
// to edit, and no CORS to worry about.
//
// Only if you deploy the frontend SEPARATELY (e.g. still hosting this HTML
// file on Netlify while the backend runs elsewhere) do you need to put the
// full backend URL here, e.g. "https://your-backend.onrender.com".
const OTP_API_BASE="";

async function requestEmailOTP(email,isResend=false){
  email=String(email||'').trim().toLowerCase();
  if(!validEmail(email)){view.msg={type:'err',text:'Invalid Email ID.'};render();return;}
  if(!isResend && findUser(email)!==-1){view.msg={type:'err',text:'This email ID is already registered.'};render();return;}
  if(isResend && !state.pendingRegistration){view.msg={type:'err',text:'Start registration first.'};render();return;}
  view.msg={type:'ok',text:'Checking email and sending OTP...'};render();
  try{
    const r=await fetch(OTP_API_BASE+'/send-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,resend:isResend})});
    let data={}; try{data=await r.json();}catch(_){data={};}
    if(!r.ok || !data.success) throw new Error(data.message||'Unable to send OTP. Check the Gmail OTP backend.');
    if(state.pendingRegistration && isResend && state.pendingRegistration.countdownTimer)clearInterval(state.pendingRegistration.countdownTimer);
    state.pendingRegistration={email,verified:false,resendCount:Number(data.resend_count||0),expiresAt:Date.now()+Number(data.expires_in||30)*1000};
    view.msg={type:'ok',text:'OTP sent to '+email+'. Check Gmail now.'};
    pushLog('Gmail OTP sent to '+email);
    render();
  }catch(e){
    view.msg={type:'err',text:e.message||'Unable to send OTP. Check that the backend URL is correct and the backend is running.'};
    render();
  }
}

async function startRegistration(email){
  await requestEmailOTP(email,false);
}

async function verifyRegistrationOTP(otp){
  const p=state.pendingRegistration;
  if(!p)return;
  if(Date.now()>=(p.expiresAt||0)){view.msg={type:'err',text:'Invalid OTP. The OTP expired after 30 seconds. Click Resend OTP.'};render();return;}
  if(!/^\d{6}$/.test(otp)){view.msg={type:'err',text:'Enter the 6-digit OTP received in Gmail.'};render();return;}
  view.msg={type:'ok',text:'Verifying OTP...'};render();
  try{
    const r=await fetch(OTP_API_BASE+'/verify-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:p.email,otp})});
    let data={}; try{data=await r.json();}catch(_){data={};}
    if(!r.ok || !data.success) throw new Error(data.message||'Invalid or expired OTP.');
    p.verified=true;view.msg={type:'ok',text:'Gmail OTP verified successfully. Create your password.'};pushLog('Gmail OTP verified for '+p.email);render();
  }catch(e){view.msg={type:'err',text:e.message||'Invalid or expired OTP.'};render();}
}

function finishRegistration(email,password,confirm){
  const p=state.pendingRegistration;
  if(!p||!p.verified){view.msg={type:'err',text:'Verify your Gmail OTP first.'};render();return;}
  if(!validPassword(password)){view.msg={type:'err',text:'Password must contain at least 8 characters.'};render();return;}
  if(password!==confirm){view.msg={type:'err',text:'Passwords do not match.'};render();return;}
  if(findUser(email)!==-1){view.msg={type:'err',text:'This email ID is already registered.'};render();return;}
  state.users.push({email,mobile:'',password,kycStatus:'not-started'});
  pushLog('New user registered: '+email);state.pendingRegistration=null;
  view.tab='login';view.msg={type:'ok',text:'Registration successful. Login with your email ID and password, then complete KYC.'};render();
}

function doLogin(username,password){
  username=String(username||'').trim().toLowerCase();
  if(!username||!password){view.msg={type:'err',text:'Enter both email ID/username and password.'};render();return;}
  // CEO and bank employees keep their existing uppercase usernames.
  const staffName=String(username).toUpperCase();
  if(staffName==='CEO'){
    if(password!=='CEO of OBS'){view.msg={type:'err',text:'Invalid CEO password.'};render();return;}
    state.session={role:'ceo'};pushLog('CEO logged in.');view={screen:'shell',panel:'ceo-overview'};render();return;
  }
  const empIdx=BANKS.findIndex(b=>b.employee===staffName);
  if(empIdx!==-1){
    if(password!==employeePassword(empIdx)){view.msg={type:'err',text:'Invalid bank employee password.'};render();return;}
    state.session={role:'employee',bank:empIdx};pushLog(staffName+' logged in.');view={screen:'shell',panel:'employee-overview'};render();return;
  }
  if(!validEmail(username)){view.msg={type:'err',text:'Enter a valid email ID for user login.'};render();return;}
  const uIdx=findUser(username);
  if(uIdx===-1){view.msg={type:'err',text:'User is not registered.'};render();return;}
  if(state.users[uIdx].password!==password){view.msg={type:'err',text:'Invalid password.'};render();return;}
  state.session={role:'user',userIndex:uIdx};pushLog('User '+username+' logged in.');
  const mobile=state.users[uIdx].mobile||'';
  const mine=mobile?accountsForMobile(mobile):[];
  const approved=mine.filter(a=>a.kycStatus==='approved');
  if(mine.length===0){view={screen:'shell',panel:'no-account'};}
  else if(approved.length===1){state.session.currentAccount=approved[0].idx;view={screen:'shell',panel:'dashboard'};}
  else if(approved.length>1){view={screen:'shell',panel:'select-account'};}
  else{view={screen:'shell',panel:'kyc-status'};}
  render();
}

function panelDeleteAccount(main){const a=currentAcc();panelHeader(main,'Delete this account');msgBox(main);if(!a){return;}const card=el('div',{class:'card',style:'max-width:500px;'});card.append(el('p',{style:'color:var(--muted);line-height:1.6'},'Account '+a.acn+' can be deleted only with the correct PIN and zero balance.'));const pin=fieldInput('Security PIN','password','4 digits');card.append(pin.wrap);const btn=el('button',{class:'btn danger'},'Delete account');btn.onclick=()=>{if(pin.input.value!==a.pin){view.msg={type:'err',text:'Incorrect PIN.'};render();return;}if(a.bal!==0){view.msg={type:'err',text:'Account cannot be deleted while balance is '+fmtMoney(a.bal)+'.'};render();return;}state.accounts.splice(state.session.currentAccount,1);state.session.currentAccount=undefined;view.panel='no-account';view.msg={type:'ok',text:'Account deleted successfully.'};render();};card.append(btn);main.append(card);}
function fmtMoney2(n){return Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});}
/* ===== STEP 1: find recipient by account number or mobile number ===== */
function panelTransfer(main){
  const a=currentAcc();panelHeader(main,'Transfer money',BANKS[a.bank].name+' · '+a.acn);msgBox(main);
  if(a.blocked){main.append(el('div',{class:'msg-banner err'},'Your account is blocked.'));return;}
  const card=el('div',{class:'card',style:'max-width:600px;'});
  const mode=view.transferMode||'acn';
  const radios=el('div',{class:'radio-opts'});
  [['acn','By account number'],['mob','By mobile number']].forEach(([id,l])=>{
    const lab=el('label',{class:mode===id?'checked':''}),r=el('input',{type:'radio',name:'tmode',value:id});
    r.checked=mode===id;r.onchange=()=>{view.transferMode=id;render();};
    lab.append(r,document.createTextNode(l));radios.append(lab);
  });
  card.append(radios);
  const lookup=fieldInput(mode==='acn'?'Recipient account number':'Recipient mobile number','text',mode==='acn'?'Account number':'10 digits');
  card.append(lookup.wrap);
  const find=el('button',{class:'btn'},'Find recipient');
  find.onclick=()=>{
    const v=lookup.input.value.trim();let idx=-1;
    if(mode==='acn')idx=findAccount(v);
    else if(validMobile(v)){const ms=accountsForMobile(v).filter(x=>x.kycStatus==='approved');idx=ms.length===1?ms[0].idx:-2;}
    if(idx===-1){view.msg={type:'err',text:'Recipient account not found.'};render();return;}
    if(idx===-2){view.msg={type:'err',text:'Multiple or unavailable accounts found. Use account number.'};render();return;}
    if(idx===state.session.currentAccount){view.msg={type:'err',text:'You cannot transfer money to your own account.'};render();return;}
    const r=state.accounts[idx];
    if(r.blocked){view.msg={type:'err',text:'Recipient account is blocked.'};render();return;}
    view.transferData={receiverIdx:idx,amount:''};
    view.msg=null;view.panel='transfer-amount';render();
  };
  card.append(find);main.append(card);
}
/* ===== STEP 2: recipient card + amount entry ===== */
function panelTransferAmount(main){
  const a=currentAcc();
  const td=view.transferData;
  if(!td||!state.accounts[td.receiverIdx]){view.panel='transfer';render();return;}
  const r=state.accounts[td.receiverIdx];
  panelHeader(main,'Enter amount',BANKS[a.bank].name+' · '+a.acn);
  msgBox(main);
  backBtn(main,'Change recipient',()=>{view.panel='transfer';view.msg=null;render();});
  const card=el('div',{class:'card',style:'max-width:600px;'});
  card.append(el('div',{class:'card',style:'background:var(--surface-2);margin-bottom:18px;'},[
    el('div',{style:'font-size:11px;color:var(--muted)'},'PAYING TO'),
    el('div',{style:'font-family:Fraunces;font-size:18px;margin-top:6px'},r.accountType==='business'?r.companyName:r.name),
    el('div',{class:'mono',style:'color:var(--muted);font-size:12.5px;margin-top:4px'},r.mobile)
  ]));
  const amount=fieldInput('Amount to transfer','number','0');
  amount.input.value=td.amount||'';
  card.append(amount.wrap);
  card.append(el('div',{class:'hint',style:'margin-bottom:18px;'},'Available balance: '+fmtMoney(a.bal)));
  const send=el('button',{class:'btn'},'Send');
  send.onclick=()=>{
    const n=Number(amount.input.value);
    if(!Number.isFinite(n)||n<=0){view.msg={type:'err',text:'Enter a valid amount.'};render();return;}
    if(n>a.bal){view.msg={type:'err',text:'Insufficient balance.'};render();return;}
    td.amount=n;view.msg=null;view.panel='transfer-pin';render();
  };
  card.append(send);main.append(card);
}
/* ===== STEP 3: security PIN entry ===== */
function panelTransferPin(main){
  const a=currentAcc();
  const td=view.transferData;
  if(!td||!state.accounts[td.receiverIdx]||!td.amount){view.panel='transfer';render();return;}
  const r=state.accounts[td.receiverIdx];
  panelHeader(main,'Enter security PIN',BANKS[a.bank].name+' · '+a.acn);
  msgBox(main);
  backBtn(main,'Change amount',()=>{view.panel='transfer-amount';view.msg=null;render();});
  const card=el('div',{class:'card',style:'max-width:600px;'});
  card.append(el('div',{class:'card',style:'background:var(--surface-2);margin-bottom:18px;'},[
    el('div',{style:'font-size:11px;color:var(--muted)'},'PAYING TO'),
    el('div',{style:'font-family:Fraunces;font-size:18px;margin-top:6px'},r.accountType==='business'?r.companyName:r.name),
    el('div',{class:'mono',style:'color:var(--muted);font-size:12.5px;margin-top:4px'},r.mobile),
    el('div',{style:'font-family:IBM Plex Mono;font-size:24px;margin-top:12px;color:var(--gold)'},'Rs.'+fmtMoney2(td.amount))
  ]));
  const pin=fieldInput('Your security PIN','password','4 digits');
  pin.input.maxLength=4;pin.input.inputMode='numeric';
  pin.input.addEventListener('input',()=>pin.input.value=pin.input.value.replace(/\D/g,''));
  card.append(pin.wrap);
  const confirm=el('button',{class:'btn'},'Confirm transfer');
  confirm.onclick=()=>{
    if(pin.input.value!==a.pin){view.msg={type:'err',text:'Incorrect PIN. Transfer cancelled.'};render();return;}
    const n=td.amount;
    a.bal-=n;state.accounts[td.receiverIdx].bal+=n;
    const st=nowStamp();
    const record={fromName:a.accountType==='business'?a.companyName:a.name,fromAcn:a.acn,toName:r.accountType==='business'?r.companyName:r.name,toAcn:r.acn,amount:n,date:st.date,time:st.time};
    state.transactions.push({sender:a.acn,receiver:r.acn,amount:n,date:st.date,time:st.time});
    pushLog('Sent to '+r.acn,n,'debit');
    view.lastTransfer=record;view.msg=null;view.panel='transfer-success';render();
  };
  card.append(confirm);main.append(card);
}
/* ===== STEP 4: success receipt ===== */
function panelTransferSuccess(main){
  const t=view.lastTransfer;
  if(!t){view.panel='dashboard';render();return;}
  panelHeader(main,'Transfer complete');
  const card=el('div',{class:'card',style:'max-width:600px;text-align:center;'});
  card.append(el('div',{style:'width:56px;height:56px;border-radius:50%;background:var(--mint);color:#0B131D;display:flex;align-items:center;justify-content:center;font-size:28px;margin:6px auto 14px;'},'✓'));
  card.append(el('div',{style:'font-family:Fraunces;font-size:19px;color:var(--mint);'},'Transfer successful'));
  const details=el('div',{style:'text-align:left;margin-top:22px;border-top:1px solid var(--line);padding-top:18px;'});
  [['From',t.fromName+' · '+t.fromAcn],['To',t.toName+' · '+t.toAcn],['Date',t.date],['Time',t.time]].forEach(([k,v])=>{
    const row=el('div',{style:'display:flex;justify-content:space-between;padding:8px 0;font-size:13.5px;'});
    row.append(el('span',{style:'color:var(--muted);'},k),el('span',{class:'mono'},String(v)));
    details.append(row);
  });
  card.append(details);
  card.append(el('div',{style:'font-family:IBM Plex Mono;font-size:30px;margin-top:20px;'},'Rs.'+fmtMoney2(t.amount)));
  const row=el('div',{style:'display:flex;gap:10px;margin-top:26px;'});
  const again=el('button',{class:'btn'},'Send again'),home=el('button',{class:'btn secondary'},'Home');
  again.onclick=()=>{
    if(view.transferData&&state.accounts[view.transferData.receiverIdx]){view.transferData.amount='';view.panel='transfer-amount';}
    else{view.panel='transfer';}
    view.msg=null;render();
  };
  home.onclick=()=>{view.transferData=null;view.lastTransfer=null;view.panel='dashboard';view.msg=null;render();};
  row.append(again,home);card.append(row);
  main.append(card);
}
function panelHistory(main){const a=currentAcc();panelHeader(main,'Transaction history',BANKS[a.bank].name+' · '+a.acn);const rows=state.transactions.filter(t=>t.sender===a.acn||t.receiver===a.acn).slice().reverse();if(!rows.length){main.append(el('div',{class:'card'},[el('div',{class:'empty-state'},'No transactions found.')]));return;}const table=el('table'),head=el('tr');['Type','Counterparty','Amount','Date','Time'].forEach(h=>head.append(el('th',{},h)));table.append(head);rows.forEach(t=>{const sent=t.sender===a.acn,ci=findAccount(sent?t.receiver:t.sender),ca=ci>=0?state.accounts[ci]:null,tr=el('tr');tr.append(el('td',{},el('span',{class:'status-tag '+(sent?'blocked':'active')},sent?'Sent':'Received')),el('td',{},ca?(ca.accountType==='business'?ca.companyName:ca.name)+' · '+BANKS[ca.bank].name:String(sent?t.receiver:t.sender)),el('td',{style:'color:'+(sent?'var(--rose)':'var(--mint)')},(sent?'-':'+')+fmtMoney(t.amount)),el('td',{},t.date),el('td',{},t.time));table.append(tr);});main.append(el('div',{class:'card'},[table]));}

function renderEmployeePanel(main){const p=view.panel||'employee-overview';if(p==='employee-overview')return panelEmployeeOverview(main);if(p==='employee-lookup')return panelEmployeeLookup(main);if(p==='employee-kyc')return panelEmployeeKYC(main);}
function panelEmployeeOverview(main){const b=state.session.bank;panelHeader(main,BANKS[b].name+' employee dashboard','Employee access is restricted to '+BANKS[b].name+'.');const accounts=state.accounts.filter(a=>a.bank===b);const kycs=state.kycRequests.filter(k=>k.bank===b&&k.status==='pending');main.append(el('div',{class:'stat-row'},[el('div',{class:'stat'},[el('div',{class:'label'},'BANK ACCOUNTS'),el('div',{class:'value'},String(accounts.length))]),el('div',{class:'stat'},[el('div',{class:'label'},'PENDING KYC'),el('div',{class:'value'},String(kycs.length))]) ]));main.append(el('div',{class:'card'},[el('p',{style:'color:var(--muted);line-height:1.7'},'You can search account number, view account details and balance, and verify KYC requests belonging only to '+BANKS[b].name+'. You cannot see accounts or KYC requests belonging to another bank.')]));}
function employeeAccountCard(a){const card=el('div',{class:'card'});const title=a.accountType==='business'?a.companyName:a.name;card.append(el('div',{style:'font-family:Fraunces;font-size:18px'},title),el('p',{class:'mono',style:'color:var(--muted)'},'Account: '+a.acn+' · '+BANKS[a.bank].name));const table=el('table');[['Account holder',a.name],['Account type',a.accountType],['Mobile',a.mobile],['Email',a.email],['Balance',fmtMoney(a.bal)],['KYC',a.kycStatus],['Status',a.blocked?'Blocked':'Active']].forEach(([k,v])=>{const tr=el('tr');tr.append(el('th',{},k),el('td',{},String(v)));table.append(tr);});card.append(table);return card;}
function panelEmployeeLookup(main){const b=state.session.bank;panelHeader(main,'Find an account','Only '+BANKS[b].name+' accounts can be viewed.');msgBox(main);const card=el('div',{class:'card',style:'max-width:520px;'}),f=fieldInput('Account number','text','Enter account number');card.append(f.wrap);const btn=el('button',{class:'btn'},'Search');btn.onclick=()=>{const idx=findAccount(f.input.value.trim());if(idx===-1){view.msg={type:'err',text:'Account not found.'};render();return;}if(state.accounts[idx].bank!==b){view.msg={type:'err',text:'Access denied. This account belongs to another bank.'};render();return;}view.employeeFound=idx;renderEmployeeLookupResult(main,idx);};card.append(btn);main.append(card);if(view.employeeFound!==undefined&&state.accounts[view.employeeFound]&&state.accounts[view.employeeFound].bank===b)main.append(employeeAccountCard(state.accounts[view.employeeFound]));}
function renderEmployeeLookupResult(){}
function panelEmployeeKYC(main){const b=state.session.bank;panelHeader(main,'KYC verification','Only KYC requests submitted for '+BANKS[b].name+' are visible.');msgBox(main);const rows=state.kycRequests.filter(k=>k.bank===b);if(!rows.length){main.append(el('div',{class:'card'},[el('div',{class:'empty-state'},'No KYC requests for this bank.')]));return;}rows.slice().reverse().forEach(k=>{const card=el('div',{class:'card'}),u=state.users.find(x=>x.mobile===k.mobile);card.append(el('div',{style:'font-family:Fraunces;font-size:17px'},'Customer: '+k.mobile),el('p',{style:'color:var(--muted)'},'KYC status: '+k.status.toUpperCase()+' · Bank: '+BANKS[k.bank].name));card.append(el('p',{style:'font-size:13px;color:var(--muted);line-height:1.6'},'Demo KYC checklist: Aadhaar, PAN, mobile OTP, email, address proof, DOB, selfie/photo and signature. Verify the submitted information according to your bank process.'));if(k.status==='pending'){const verify=el('button',{class:'btn'},'KYC Complete');verify.onclick=()=>{k.status='approved';if(u)u.kycStatus='approved';state.accounts.filter(a=>a.mobile===k.mobile&&a.bank===b).forEach(a=>a.kycStatus='approved');pushLog(BANKS[b].name+' employee completed KYC for '+k.mobile);view.msg={type:'ok',text:'KYC completed. SMS sent to '+k.mobile+': KYC has been completed, now you can login and use your account.'};render();};card.append(verify);}else card.append(el('div',{class:'msg-banner ok'},'KYC already completed for this customer.'));main.append(card);});}
render();
